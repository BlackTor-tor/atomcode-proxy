name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Extract version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -like "refs/tags/v*") {
            $version = $ref.Substring("refs/tags/v".Length)
            "IS_TAG=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $content = Get-Content atomcode_proxy/__init__.py -Raw
            if ($content -match '__version__\s*=\s*["'']([^"'']+)["'']') {
              $version = $matches[1]
            } else {
              $version = "0.0.0"
            }
            "IS_TAG=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version resolved: $version"

      - name: Write version into package (tag only)
        shell: pwsh
        run: |
          if ($env:IS_TAG -eq "true") {
            $path = "atomcode_proxy/__init__.py"
            $content = Get-Content $path -Raw
            $new = $content -replace '__version__\s*=\s*"[^"]+"', ('__version__ = "' + $env:VERSION + '"')
            Set-Content -Path $path -Value $new -NoNewline
            Write-Host "Updated $path to version $env:VERSION"
          } else {
            Write-Host "Not a tag trigger, skip version rewrite."
          }

      - name: Build executable
        run: pyinstaller atomcode-proxy.spec --clean --noconfirm

      - name: Rename artifact
        shell: pwsh
        run: |
          $artifact = "atomcode-proxy-$env:VERSION-windows-x64.exe"
          Copy-Item "dist\atomcode-proxy.exe" $artifact
          Write-Host "Artifact ready: $artifact"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            atomcode-proxy-${{ env.VERSION }}-windows-x64.exe
            .env.example
          generate_release_notes: true
          append_body: true
          body: |
            ## 便携版使用说明（Windows）

            1. 下载本 Release 中的 `atomcode-proxy-<版本>-windows-x64.exe` 与 `.env.example`，放到**同一目录**。
            2. 将 `.env.example` 复制为 `.env`，按需编辑（如 daemon 地址、token、默认模型等）。
            3. 双击 exe 即可运行：弹出的**控制台窗口即日志**，关闭窗口即停止服务。

            - 默认监听 `127.0.0.1:8765`
            - 前置条件：AtomCode 本地 daemon 已启动（默认 `http://127.0.0.1:13456`）
            - 提示：Windows Defender / 杀毒软件可能对 PyInstaller 单文件程序误报，如有拦截请添加信任或允许运行。
